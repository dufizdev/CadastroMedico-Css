<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class = "header-form">
             <a href="index.html"><img src="109617.png" width="35px" height="35px" alt=""></a>
            <h1>Formulario</h1>
            </div>
    <form>
        <div class="form-control">
            <label for="login">Login:</label>
            <input type="text" id="login" placeholder="Digite seu login">
        </div>

        <div class="form-control">
            <label for="Email">Email:</label>
            <input type="text" id="email" placeholder="Digite seu Email">
        </div>

        <div class="form-control">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <div class="form-control">
            <div class = "opcoes">
            <label for="senha">Remember My Password</label>
            <input type="checkbox" id="senha" placeholder="Digite sua senha">
            </div>

        <div class="form-control">
            <label>Tipo de acesso</label>
            <div class="opcoes">
                <input type="radio" id="aluno" name="tipo" value="aluno"/>
                <label for="aluno">Aluno</label>

                <input type="radio" id="professor" name="tipo" value="professor"/>
                <label for="professor">Professor</label>
            </div>
         </div>

            <div class="form-contro">
                <label for="cidade">Cidade</label>
                <select id="cidade">
                    <option value="selecionar" selected hidden>Selecione sua cidade</option>
                    <option value="jundiai">jundiai</option>
                    <option value="sao paulo">são paulo</option>
                    <option value="cotia">Cotia</option>
                </select>
                <div class="form-control">
                    <button type="submit">Entrar</button>
                </div>
            </div>         
        </div>
    </form>

    </div>
</body>
</html>
